databaseChangeLog:
  - changeSet:
      id: 81
      author: pirhoo
      changes:
        - createTable:
            tableName: statement
            columns:
              - column:
                  name: id
                  type: varchar(96)
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: prj_id
                  type: varchar(96)
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: run_id
                  type: varchar(96)
                  constraints:
                    nullable: false
              - column:
                  name: model
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: model_version
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: entity_id
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: entity_type
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: property
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: value
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: doc_id
                  type: varchar(96)
                  constraints:
                    nullable: false
              - column:
                  name: sheet
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: row_number
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: column_name
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: first_seen
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: last_seen
                  type: datetime
                  constraints:
                    nullable: false
        - createIndex:
            indexName: statement_prj_entity
            tableName: statement
            columns:
              - column:
                  name: prj_id
                  type: varchar(96)
              - column:
                  name: entity_id
                  type: text

  - changeSet:
      id: 82
      author: pirhoo
      changes:
        - createTable:
            tableName: extraction_mapping
            columns:
              - column:
                  name: id
                  type: varchar(96)
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: prj_id
                  type: varchar(96)
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: user_id
                  type: varchar(96)
              - column:
                  name: name
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: definition
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: datetime
                  constraints:
                    nullable: false
        - createIndex:
            indexName: extraction_mapping_prj_id
            tableName: extraction_mapping
            columns:
              - column:
                  name: prj_id
                  type: varchar(96)
